name: CI
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22, not 20 like other workflows here - e2e/supabase-helper.js
      # creates a plain Node-side Supabase client (for server-side
      # assertions/cleanup, not just the browser-side one the app itself
      # uses), and its realtime dependency needs a native WebSocket, which
      # only Node 22+ provides. The `test` job doesn't strictly need this,
      # but is kept in step for one Node version per workflow file.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # A cache hit restores the browser binary but not the OS packages it
      # needs (those live outside the cached path) - installing deps alone
      # is fast since it skips the browser download this second time.
      - name: Install Chromium's system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright e2e suite
        run: npm run test:e2e
        env:
          # A separate Supabase project from the deploy workflow's - e2e
          # specs create real rows, and this app's RLS makes every asset
          # visible to every logged-in user, so this must never point at
          # the production project. See CLAUDE.md's testing conventions.
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
